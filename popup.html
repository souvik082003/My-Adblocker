<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      text-align: center;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #d33;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>YouTube Ad Blocker</h1>
  <label class="switch">
    <input type="checkbox" id="toggle" />
    <span class="slider"></span>
  </label>
  <div id="status">Loading...</div>
  <script src="popup.js"></script>
</body>
</html>
